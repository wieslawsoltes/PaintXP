<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0054e3">
  <meta name="description" content="An independent XP-era Paint recreation with WebGPU, touch support and a local MCP bridge. Plain HTML and JavaScript.">
  <title>untitled - Paint</title>
  <link rel="icon" href="assets/paint.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main id="paint-window" aria-label="Paint">
    <header id="titlebar">
      <img src="assets/paint.svg" width="16" height="16" alt="">
      <span id="window-title">untitled - Paint</span>
      <div id="window-controls"><button id="minimize" aria-label="Minimize" title="Minimize">_</button><button id="maximize" aria-label="Maximize" title="Full screen"><span class="maximize-glyph"></span></button><button id="close-window" aria-label="Close" title="Close">×</button></div>
    </header>
    <nav id="menubar" role="menubar" aria-label="Menu bar"></nav>
    <div id="workspace">
      <aside id="toolbox" aria-label="Tool box">
        <div id="tools" role="toolbar" aria-label="Drawing tools"></div>
        <div id="tool-options" aria-label="Tool options"></div>
      </aside>
      <section id="drawing-area" aria-label="Drawing workspace">
        <div id="scroller" tabindex="-1"><div id="paper-space"></div></div>
        <canvas id="view-canvas" aria-hidden="true"></canvas>
        <canvas id="overlay" tabindex="0" aria-label="Drawing canvas. Use the tool box to select a tool. Pinch with two fingers to zoom and pan."></canvas>
        <div id="text-layer"></div>
      </section>
    </div>
    <section id="colorbox" aria-label="Color box"><div id="current-colors" title="Foreground / background. Click to exchange colors."><span id="background-swatch"></span><span id="foreground-swatch"></span></div><div id="palette" role="toolbar" aria-label="Color palette"></div></section>
    <footer id="statusbar"><span id="status-help">For Help, click Help Topics on the Help Menu.</span><span id="status-position"></span><span id="status-size"></span><span class="size-grip" aria-hidden="true"></span></footer>
  </main>
  <section id="fontbar" class="floating-panel" hidden aria-label="Fonts"><div class="panel-title">Fonts<button class="panel-close" aria-label="Close font toolbar">×</button></div><div class="font-controls"><select id="font-family" aria-label="Font"><option>Arial</option><option>Tahoma</option><option>Verdana</option><option>Times New Roman</option><option>Courier New</option><option>Georgia</option><option>Comic Sans MS</option></select><select id="font-size" aria-label="Font size"><option>8</option><option>9</option><option>10</option><option selected>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option></select><button id="font-bold" title="Bold" aria-label="Bold"><b>B</b></button><button id="font-italic" title="Italic" aria-label="Italic"><i>I</i></button><button id="font-underline" title="Underline" aria-label="Underline"><u>U</u></button></div></section>
  <section id="thumbnail" class="floating-panel" hidden aria-label="Thumbnail"><div class="panel-title">Thumbnail<button class="panel-close" aria-label="Close thumbnail">×</button></div><canvas width="160" height="120"></canvas></section>
  <div id="menus"></div><div id="dialogs"></div>
  <div id="busy" hidden role="status"><span class="hourglass">⌛</span><span id="busy-label">Working…</span></div>
  <button id="restore-window" hidden><img src="assets/paint.svg" width="16" height="16" alt=""> untitled - Paint</button>
  <input id="open-file" type="file" accept="image/*,.bmp,.dib,.tif,.tiff" hidden>
  <input id="camera-file" type="file" accept="image/*" capture="environment" hidden>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
